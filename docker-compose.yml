services:
  app:
    container_name: tikum_app
    image: tikum-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tikum_network

  nginx:
    container_name: tikum_nginx
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./backend/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tikum_network

  postgres:
    container_name: tikum_postgres
    image: postgres:17-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: tikum
      POSTGRES_USER: tikum
      POSTGRES_PASSWORD: secret
    volumes:
      - tikum_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tikum -d tikum"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - tikum_network

  redis:
    container_name: tikum_redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - tikum_network

  queue:
    container_name: tikum_queue
    image: tikum-backend:local
    working_dir: /var/www/html
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=90
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tikum_network

  reverb:
    container_name: tikum_reverb
    image: tikum-backend:local
    working_dir: /var/www/html
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - tikum_network

volumes:
  tikum_postgres_data:

networks:
  tikum_network:
    driver: bridge
